name: CI
on:
  pull_request:
  push:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - run: npm ci
      - run: npm audit --audit-level=high
      - run: npm run check          # astro check + tsc + eslint
      - run: npm run test           # Vitest
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e       # Playwright + axe-core
      - name: Lighthouse CI
        run: |
          npm i -g @lhci/cli
          lhci autorun --collect.staticDistDir=./dist \
            --assert.assertions.categories:performance=0.95 \
            --assert.assertions.categories:accessibility=0.95 \
            --assert.assertions.categories:seo=0.95
